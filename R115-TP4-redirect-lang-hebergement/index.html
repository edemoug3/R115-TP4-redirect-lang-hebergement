<!DOCTYPE html>
<html lang="fr">
<head>

  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Langage / Langue</title>
  <link rel="alternate" hreflang="fr" href="/fr/">
  <link rel="alternate" hreflang="en" href="/en/">
</head>

       onclick="document.cookie = 'nf_lang=fr; path=/; SameSite=Strict'">Accueil en français</a></li>
    <li><a lang="en" href="/en/"
       onclick="document.cookie = 'nf_lang=en; path=/; SameSite=Strict'">Home in english</a></li>
  </ul></nav>
</body>
</html>
